name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deploypilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deploypilot_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/deploypilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm docs:check
      - run: DATABASE_URL=postgresql://x:x@localhost:5432/x DIRECT_URL=postgresql://x:x@localhost:5432/x pnpm --filter @deploypilot/database validate
      - run: pnpm --filter @deploypilot/database exec prisma db execute --schema schema.prisma --file ci-roles.sql
      - run: pnpm --filter @deploypilot/database exec prisma migrate deploy --schema schema.prisma
      - run: pnpm --filter @deploypilot/api exec tsx scripts/verify-tenancy.ts
      - run: pnpm --filter @deploypilot/api exec tsx scripts/verify-rate-limit.ts
      - run: pnpm test
      - run: node --test scripts/backup-retention.test.mjs
      - run: node --test scripts/maintenance-policy.test.mjs
      - run: pnpm typecheck
      - run: node --input-type=module -e "await import('./packages/database/client.ts')"
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_API_URL: http://localhost:4000
      - uses: docker/setup-buildx-action@v3
      - run: pnpm --filter @deploypilot/worker test
        env:
          DOCKER_SMOKE: '1'
