services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deploypilot
      POSTGRES_PASSWORD: deploypilot
      POSTGRES_DB: deploypilot
    ports: ["127.0.0.1:5432:5432"]
    volumes: [deploypilot-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deploypilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["legacy-queue"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [deploypilot-redis:/data]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://deploypilot:deploypilot@postgres:5432/deploypilot
      DIRECT_URL: postgresql://deploypilot:deploypilot@postgres:5432/deploypilot
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["127.0.0.1:4000:4000"]
    restart: unless-stopped

  # Linux-only containerized worker. Native Node is recommended on Windows/macOS.
  # Host networking lets the agent check the host-loopback published app port.
  worker:
    profiles: ["linux-worker"]
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      WORKER_API_URL: ${WORKER_API_URL:-http://localhost:4000}
      WORKER_ID: ${WORKER_ID}
      WORKER_TOKEN: ${WORKER_TOKEN}
      DOCKER_HOST: unix:///var/run/docker.sock
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  deploypilot-postgres:
  deploypilot-redis:
